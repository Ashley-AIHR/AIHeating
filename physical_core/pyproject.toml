[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-heating-core"
version = "0.1.0"
description = "Deterministic synthetic Phase 1A secondary heating physics"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
validation = ["pytest>=8,<10", "matplotlib>=3.9,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
