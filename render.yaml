services:
  - type: web
    runtime: node
    name: aiheating
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: AI_ACCESS_TOKEN
        generateValue: true
      - key: TELEMETRY_INGEST_TOKEN
        generateValue: true
