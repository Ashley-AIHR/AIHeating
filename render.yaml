services:
  - type: web
    runtime: docker
    name: aiheating
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: AI_ACCESS_TOKEN
        generateValue: true
