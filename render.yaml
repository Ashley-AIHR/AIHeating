services:
  - type: web
    runtime: docker
    name: aiheating
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: AI_ACCESS_TOKEN
        generateValue: true
      - key: TELEMETRY_INGEST_TOKEN
        generateValue: true
